spring.application.name=resqora-backend

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.datasource.url=${RESQORA_DB_URL}
spring.datasource.username=${RESQORA_DB_USERNAME}
spring.datasource.password=${RESQORA_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none

resqora.jwt.secret=${RESQORA_JWT_SECRET}
resqora.jwt.expiration-ms=${RESQORA_JWT_EXPIRATION_MS:3600000}
resqora.cors.allowed-origins=${RESQORA_CORS_ORIGINS:http://localhost:5173}

resqora.ai.gemini-api-key=${GEMINI_API_KEY:}
resqora.ai.gemini-model=${GEMINI_MODEL:gemini-3.5-flash-lite}
# per user, per day
resqora.ai.daily-limit=${RESQORA_AI_USER_DAILY_LIMIT:10}
# daily limits reset at midnight in this zone
resqora.timezone=${RESQORA_TIMEZONE:Asia/Kolkata}
# whole app, per day (keep well below the Gemini free-tier requests-per-day)
resqora.ai.daily-cap=${RESQORA_AI_DAILY_CAP:50}

# Job suggestions (Adzuna). Empty keys -> GET /api/resumes/{id}/jobs returns 503
resqora.jobs.adzuna-app-id=${ADZUNA_APP_ID:}
resqora.jobs.adzuna-app-key=${ADZUNA_APP_KEY:}
resqora.jobs.country=${RESQORA_JOBS_COUNTRY:in}

# Login protection: failed attempts allowed per window before 429
resqora.login.max-attempts-per-email=${RESQORA_LOGIN_MAX_PER_EMAIL:5}
resqora.login.max-attempts-per-ip=${RESQORA_LOGIN_MAX_PER_IP:20}
resqora.login.window-minutes=${RESQORA_LOGIN_WINDOW_MINUTES:15}
