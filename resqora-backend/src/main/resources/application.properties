spring.application.name=resqora-backend

spring.servlet.multipart.max-file-size=2MB
# the request also carries the multipart envelope, so allow a little more than the 2 MB file limit
spring.servlet.multipart.max-request-size=3MB

spring.datasource.url=${RESQORA_DB_URL}
spring.datasource.username=${RESQORA_DB_USERNAME}
spring.datasource.password=${RESQORA_DB_PASSWORD}
# small pool: free-tier Postgres allows few connections
spring.datasource.hikari.maximum-pool-size=${RESQORA_DB_POOL_SIZE:3}

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=none

resqora.jwt.secret=${RESQORA_JWT_SECRET}
resqora.jwt.expiration-ms=${RESQORA_JWT_EXPIRATION_MS:3600000}
resqora.cors.allowed-origins=${RESQORA_CORS_ORIGINS:http://localhost:5173}

resqora.ai.gemini-api-key=${GEMINI_API_KEY:}
resqora.ai.gemini-model=${GEMINI_MODEL:gemini-3.5-flash-lite}
resqora.ai.gemini-base-url=${RESQORA_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
# per user, per day
resqora.ai.daily-limit=${RESQORA_AI_USER_DAILY_LIMIT:10}
# daily limits reset at midnight in this zone
resqora.timezone=${RESQORA_TIMEZONE:Asia/Kolkata}
# whole app, per day (keep well below the Gemini free-tier requests-per-day)
resqora.ai.daily-cap=${RESQORA_AI_DAILY_CAP:50}

# Job suggestions: Jobicy's free public API (remote APAC jobs, no key). Results cached in memory for 30 minutes.
resqora.jobs.jobicy-base-url=${RESQORA_JOBICY_BASE_URL:https://jobicy.com/api/v2}

# Login protection: failed attempts allowed per window before 429
resqora.login.max-attempts-per-email=${RESQORA_LOGIN_MAX_PER_EMAIL:5}
resqora.login.max-attempts-per-ip=${RESQORA_LOGIN_MAX_PER_IP:20}
resqora.login.window-minutes=${RESQORA_LOGIN_WINDOW_MINUTES:15}
# Delete account: wrong passwords allowed per user per window before 429
resqora.account.max-password-attempts=${RESQORA_ACCOUNT_MAX_PASSWORD_ATTEMPTS:5}
resqora.account.password-window-minutes=${RESQORA_ACCOUNT_PASSWORD_WINDOW_MINUTES:15}

# Demo mode: on every startup create or reset demo@resqora.app with 3 analysed sample resumes (read-only for deletes/password)
resqora.demo.enabled=${RESQORA_DEMO_ENABLED:false}
resqora.demo.password=${RESQORA_DEMO_PASSWORD:Demo1234}

# API docs: on by default; set RESQORA_SWAGGER_ENABLED=false on a public deployment to hide Swagger UI and /v3/api-docs
springdoc.api-docs.enabled=${RESQORA_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${RESQORA_SWAGGER_ENABLED:true}
