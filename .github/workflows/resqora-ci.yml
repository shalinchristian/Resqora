
name: Resqora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: resqopra-backend/pom.xml

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t resqora-ci:latest .
